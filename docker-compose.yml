services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  api:
    build: ./server
    image: homematch-api
    env_file: server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/homematch
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: homematch-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data: