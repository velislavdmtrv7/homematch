# Production (сървърът): HTTP се пренасочва към HTTPS; HTTPS със сертификата от Let's Encrypt.
# Локално се ползва nginx/default.conf (само HTTP), който е вграден в image-а.

server_tokens off;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name homematch-demo.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name homematch-demo.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/homematch-demo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homematch-demo.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }
}